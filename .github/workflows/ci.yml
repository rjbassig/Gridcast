name: GridCast checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e '.[dev,deep]'
      - run: ruff check src api tests
      - run: pytest tests/test_temporal.py -q
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: dashboard}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: dashboard/package-lock.json}
      - run: npm ci
      - run: npm run build
        env:
          GRIDCAST_API_URL: http://127.0.0.1:8000
      - run: npm run typecheck
