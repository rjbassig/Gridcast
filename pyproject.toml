[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "gridcast"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy", "requests", "pyarrow", "duckdb", "pyyaml", "fastapi", "uvicorn", "joblib"]
[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]
research = ["scikit-learn", "matplotlib", "statsmodels", "xgboost", "lightgbm", "reportlab"]
deep = ["torch"]
[project.scripts]
gridcast = "gridcast.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
